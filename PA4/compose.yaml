
services:
  database:
    container_name: database
    image: postgres:16
    environment:
      POSTGRES_USER: roadwatch
      POSTGRES_PASSWORD: roadwatch_dev
      POSTGRES_DB: roadwatch
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - proxy-net
  backend:
    container_name: backend
    build: ./backend
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: roadwatch
      DB_USER: roadwatch
      DB_PASSWORD: roadwatch_dev
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - database
    networks:
      - proxy-net
  website:
    container_name: website
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    networks:
      - proxy-net
  processing:
    build: ./processing
    networks:
      - proxy-net
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  proxy-net:
    external: false #make true if trying to connect other docker services in a container to this system
