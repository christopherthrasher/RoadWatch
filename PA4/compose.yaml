services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: roadwatch
      POSTGRES_PASSWORD: roadwatch_dev
      POSTGRES_DB: roadwatch
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  backend:
    build: ./backend
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: roadwatch
      DB_USER: roadwatch
      DB_PASSWORD: roadwatch_dev
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - database

volumes:
  postgres_data:
