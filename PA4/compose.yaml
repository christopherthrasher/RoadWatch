services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: roadwatch
      POSTGRES_PASSWORD: roadwatch_dev
      POSTGRES_DB: roadwatch
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  processing:
    build: ./processing
    depends_on:
      - backend

volumes:
  postgres_data:
